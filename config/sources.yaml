# ============================================================
# Cấu hình chi tiết từng nguồn data
# Mỗi nguồn có: base_url, rate_limit, retry policy
# ============================================================

steam:
  name: "Steam Web API"
  base_url: "https://api.steampowered.com"
  store_url: "https://store.steampowered.com/api"   # Undocumented store endpoints
  # Steam policy: ~200 req / 5 min (per key). Conservative 500ms gap = 120 req/min max.
  # Hourly crawl (~250 req) dùng ~3.5% capacity → an toàn, không lo 429.
  rate_limit_ms: 500
  max_retries: 3
  backoff_seconds: 2
  needs_auth: true
  tos_url: "https://steamcommunity.com/dev/apiterms"
  notes: >
    Dùng GetSchemaForGame, GetPlayerSummaries (cần key).
    CCU: store.steampowered.com/api/appdetails không có CCU realtime,
    dùng endpoint charts (top 100) hoặc SteamSpy cho player counts.

itunes:
  name: "iTunes Search API"
  base_url: "https://itunes.apple.com"
  rss_url: "https://rss.applemarketingtools.com"    # Public RSS cho top charts
  # Apple guideline: ~20 req/min
  rate_limit_ms: 3000
  max_retries: 3
  backoff_seconds: 5
  needs_auth: false
  tos_url: "https://developer.apple.com/library/archive/documentation/AudioVideo/Conceptual/iTuneSearchAPI/"
  notes: >
    Search API không cần key. Top charts lấy qua RSS Apple Marketing Tools
    (public, format JSON). Multiple storefronts: VN (143472), US (143441).

igdb:
  name: "IGDB (Twitch)"
  base_url: "https://api.igdb.com/v4"
  auth_url: "https://id.twitch.tv/oauth2/token"
  # IGDB free tier: 4 req/s concurrent, 10k req/month
  rate_limit_ms: 250
  max_retries: 4
  backoff_seconds: 3
  needs_auth: true                                   # Twitch OAuth (Client Credentials)
  tos_url: "https://www.twitch.tv/p/legal/developer-agreement/"
  notes: >
    Cần Twitch app (Client ID + Secret). Lấy access token qua OAuth2
    client_credentials flow (token hết hạn sau ~60 ngày, refresh được).

news:
  name: "Game News (RSS + Reddit + Steam News)"
  # RSS: hợp pháp (publish cho syndication). Reddit JSON: public read OK.
  # Steam News: public API.
  rate_limit_ms: 1000
  max_retries: 3
  backoff_seconds: 3
  needs_auth: false
  tos_url: "https://www.redditinc.com/policies/data-api-terms"
  notes: >
    RSS feeds (Verge/Polygon/IGN/Eurogamer/TouchArcade/RPS) — publish cho syndication.
    Reddit: JSON endpoint public, không cần OAuth với rate limit nhẹ.
    Steam News API: cần STEAM_API_KEY (same as Steam crawler).

activeplayer:
  name: "ActivePlayer.io (estimated mobile MAU/DAU/CCU)"
  base_url: "https://activeplayer.io"
  sitemap_url: "https://activeplayer.io/sitemap_index.xml"
  category_url: "https://activeplayer.io/category/mobile/"
  # ActivePlayer.io: HTML pages per-game (no JSON API). robots.txt Allow all except /wp-admin/.
  # ToS has no anti-scraping clause. 123 mobile games × 1 fetch/month = ~15 min, polite 6s+jitter.
  rate_limit_ms: 6000
  jitter_ms: 3000           # random 0-3s jitter added on top of rate_limit_ms
  max_retries: 3
  backoff_seconds: 5
  needs_auth: false
  tos_url: "https://activeplayer.io/terms-and-conditions/"
  notes: >
    Estimated player counts (MAU/DAU/CCU) by platform (Google Play Android / App Store iOS).
    HTML per-game pages, parse with BeautifulSoup. 12-month history (rolling window).
    DATA IS ESTIMATE (modeled from download trends) — NOT official publisher numbers.
    ToS check: 2026-08-10, see docs/tos_compliance.md. robots.txt: only /wp-admin/ disallowed.

